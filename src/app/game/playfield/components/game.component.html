  <app-score />
  @if (gameSrv.gameWon) {
    <app-scoreboard appGameWon />
  }
    <section class="memory-game">
      @for (card of deck()?.cards; track card + '_' + gameSrv.gameGeneration; let i = $index) {
        <app-card
          [card]="card"
          [imgUrl]="deck().imgURL"
          [frontFace]="deck().frontFace"
          [coverIndex]="i"
          (click)="flipCard($event)"
          [attr.identifier] = "card"
        />
      }

      @for (card of deck()?.cards; track card + '_' + gameSrv.gameGeneration; let i = $index) {
        <app-card
          [card]="card"
          [imgUrl]="deck().imgURL"
          [frontFace]="deck().frontFace"
          [coverIndex]="i + 1"
          (click)="flipCard($event)"
        [attr.identifier] = "card" />
      }
    </section>
