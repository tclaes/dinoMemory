<div class="score-bar">
  <div class="score-status" role="status" aria-live="polite">
    <app-clicks class="score" />
    <app-timer class="score" />
  </div>
  <button type="button" class="focusable new-game-btn" (click)="_gameService.restart()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M20 4v5h-5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    New Game
  </button>
</div>
