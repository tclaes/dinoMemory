<app-score id="header"></app-score>
@if (gameSrv.gameWon) {
  <app-scoreboard appGameWon></app-scoreboard>
}
<section class="memory-game" id="memory-board">
  @for (card of gameSrv.deck.cards; track card) {
    <app-card
      [card]="card"
      [imgUrl]="deck.imgUrl"
      [frontFace]="deck.frontFace"
      class="memory-card" (click)="flipCard($event)"
    [attr.identifier] = "card"></app-card>
  }

  @for (card of gameSrv.deck.cards; track card) {
    <app-card
      [card]="card"
      [imgUrl]="deck.imgUrl"
      [frontFace]="deck.frontFace"
      class="memory-card"
      (click)="flipCard($event)"
    [attr.identifier] = "card"></app-card>
  }
</section>
