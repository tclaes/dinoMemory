<!-- <app-player *ngIf="!player.set"></app-player> -->
<div class="game-page">
  <app-score></app-score>
  @if (gameSrv.gameWon) {
    <app-scoreboard appGameWon></app-scoreboard>
  }
  <div class="board-frame">
    <section class="memory-game" id="memory-board">
      @for (card of gameSrv.deck.cards; track card + '_' + gameSrv.gameGeneration; let i = $index) {
        <app-card
          [card]="card"
          [imgUrl]="deck.imgUrl"
          [frontFace]="deck.frontFace"
          [coverIndex]="i"
          class="memory-card" (click)="flipCard($event)"
        [attr.identifier] = "card"></app-card>
      }

      @for (card of gameSrv.deck.cards; track card + '_' + gameSrv.gameGeneration; let i = $index) {
        <app-card
          [card]="card"
          [imgUrl]="deck.imgUrl"
          [frontFace]="deck.frontFace"
          [coverIndex]="i + 1"
          class="memory-card"
          (click)="flipCard($event)"
        [attr.identifier] = "card"></app-card>
      }
    </section>
  </div>
</div>
